<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Grid Buttons</title>
    <style>
        /* Centering the grid container on the screen */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f4f9;
            font-family: Arial, sans-serif;
        }

        /* Stacked grid structure */
        .button-grid {
            display: grid;
            grid-template-columns: 1fr; /* Single column for stacked layout */
            gap: 15px;                  /* Space between buttons */
            width: 100%;
            max-width: 300px;           /* Controls the uniform width of the stack */
            padding: 20px;
        }

        /* Button Styling */
        .grid-btn {
            display: block;
            text-align: center;
            text-decoration: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            background-color: #007bff;
            border-radius: 6px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        /* Hover and active effects */
        .grid-btn:hover {
            background-color: #0056b3;
        }

        .grid-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <!-- The container where JS will inject the buttons -->
    <div id="gridContainer" class="button-grid"></div>

    <script>
        /===========================================================
         * CONFIGURATION: FORMATTED CODED WORDS (BUTTON DATA)
         * Format: "Button Display Name | target_url_or_webpage.html"
         ===========================================================/
        const rawButtonData = `

            Home Page All services     | index.html
            Markdown PDF Generator     | mdpdf.html
            Assignment PDF Generator   | assign.html
  
        `;

        // 1. Target the grid wrapper
        const container = document.getElementById('gridContainer');

        // 2. Clean, split, and parse the raw configuration string line by line
        rawButtonData
            .trim()
            .split('\n')
            .forEach(line => {
                // Skip completely empty lines
                if (!line.trim()) return;

                // Separate the text label from the destination webpage URL
                const [label, url] = line.split('|');

                if (label && url) {
                    // Create an anchor link element
                    const btn = document.createElement('a');
                    
                    // Assign properties and custom styles
                    btn.textContent = label.trim();
                    btn.href = url.trim();
                    btn.className = 'grid-btn';

                    // Append the button into our centered grid structure
                    container.appendChild(btn);
                }
            });
    </script>

</body>
</html>
