<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>simple grid · code to buttons</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #f0f2f5;
            font-family: system-ui, sans-serif;
            padding: 1.5rem;
        }
        .card {
            background: #fff;
            max-width: 420px;
            width: 100%;
            padding: 2rem 1.8rem;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            border: 1px solid #e4e9f0;
        }
        .button-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            width: 100%;
        }
        .grid-btn {
            display: block;
            text-align: center;
            text-decoration: none;
            padding: 12px 18px;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            background-color: #2563eb;
            border-radius: 10px;
            transition: background-color 0.15s, transform 0.1s;
            box-shadow: 0 3px 0 #1e40af;
            border: 1px solid #3b82f6;
        }
        .grid-btn:hover { background-color: #1d4ed8; }
        .grid-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #1e40af; }

        /* hide the source code block — it's only for the JS to read */
        #codeBlock { display: none; }
    </style>
</head>
<body>

<div class="card">
    <!-- Source data: hidden from view, only JS reads it -->
    <pre id="codeBlock">
      
Home Page All services | index.html
Markdown PDF Generator | mdpdf.html
Assignment PDF Generator | assign.html

</pre>

    <div id="gridContainer" class="button-grid"></div>
</div>

<script>
(function () {
    const raw = document.getElementById('codeBlock').textContent;
    const container = document.getElementById('gridContainer');

    raw.split(/\r?\n/).forEach(line => {
        const t = line.trim();
        if (!t) return;
        const i = t.indexOf('|');
        if (i === -1) return;

        const label = t.slice(0, i).trim();
        const url   = t.slice(i + 1).trim();
        if (!label || !url) return;

        const a = document.createElement('a');
        a.textContent = label;
        a.href = url;
        a.className = 'grid-btn';
        container.appendChild(a);
    });
})();
</script>

</body>
</html>
