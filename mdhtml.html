<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Document Creator</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* Dark Theme & Base Styles */
        :root { --bg-primary: #121212; --bg-secondary: #1e1e1e; --bg-panel: #2a2a2a; --text-primary: #e0e0e0; --text-secondary: #a0a0a0; --border-color: #3a3a3a; --accent-primary: #007aff; --accent-active: #0056b3; }
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; overflow: hidden; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-primary); color: var(--text-primary); display: flex; flex-direction: column; }

        /* Top Bar */
        .top { background: var(--bg-secondary); padding: 12px 16px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
        .top h1 { font-size: 16px; font-weight: 600; flex: 1; }
        .top .btns { display: flex; gap: 8px; }
        button, .file-upload-label { padding: 6px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 13px; cursor: pointer; background: var(--bg-panel); color: var(--text-primary); transition: background-color 0.2s; display: inline-flex; align-items: center; justify-content: center; }
        button.act, .file-upload-label.act { background: var(--accent-primary); color: white; border-color: var(--accent-primary); font-weight: 500; }
        button.act:active, .file-upload-label.act:active { background: var(--accent-active); }
        #md-upload { display: none; }

        /* Main Content */
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .panel { flex: 1; overflow-y: auto; padding: 16px; }
        .edt { display: flex; flex-direction: column; }
        .edt textarea { flex: 1; width: 100%; background: var(--bg-primary); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 6px; padding: 12px; font-family: 'Courier New', monospace; font-size: 14px; resize: none; }
        .cfg { background: var(--bg-secondary); display: none; }
        .panel.active { display: flex; flex-direction: column; }

        /* Settings Panel */
        .cfg h3 { font-size: 12px; font-weight: 600; margin-top: 20px; margin-bottom: 8px; text-transform: uppercase; color: var(--text-secondary); border-bottom: 1px solid var(--border-color); padding-bottom: 4px;}
        .cfg h3:first-child { margin-top: 0; }
        .pnl { background: var(--bg-panel); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
        .cfg-lbl { font-size: 13px; font-weight: 500; display: block; margin-bottom: 6px; color: var(--text-secondary); }
        .cfg select, .cfg input[type="text"] { width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 13px; background: var(--bg-primary); color: var(--text-primary); }
        .cfg input[type="color"] { padding: 2px; height: 38px; cursor: pointer; width: 100%; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-primary); }
        .cfg-row { margin-bottom: 12px; }
        .cfg-row:last-child { margin-bottom: 0; }
        .slider-group { display: grid; grid-template-columns: 1fr 60px; gap: 8px; align-items: center; }
        .slider-group input[type="range"] { width: 100%; -webkit-appearance: none; background: transparent; margin: 0; }
        .slider-group input[type="range"]::-webkit-slider-runnable-track { height: 4px; background: var(--border-color); border-radius: 2px; }
        .slider-group input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: var(--accent-primary); cursor: pointer; margin-top: -6px; }
        .slider-group input[type="number"] { width: 100%; padding: 6px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 13px; background: var(--bg-primary); color: var(--text-primary); text-align: center; -moz-appearance: textfield; }
        .slider-group input::-webkit-outer-spin-button, .slider-group input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        /* Mobile & Modal Styles */
        .bottom-nav { display: flex; background: var(--bg-secondary); border-top: 1px solid var(--border-color); flex-shrink: 0; }
        .nav-btn { flex: 1; padding: 12px; text-align: center; font-size: 14px; font-weight: 500; color: var(--text-secondary); cursor: pointer; border: none; background: none; }
        .nav-btn.active { color: var(--accent-primary); }
        .modal-overlay { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.7); justify-content: center; align-items: center; }
        .modal-content { background-color: var(--bg-panel); padding: 20px; border: 1px solid var(--border-color); width: 90%; max-width: 700px; border-radius: 8px; display: flex; flex-direction: column; max-height: 80vh; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 10px; }
        .modal-header h2 { font-size: 16px; font-weight: 600; }
        .close-button { color: #aaa; font-size: 28px; font-weight: bold; cursor: pointer; }
        .modal-body { flex: 1; overflow-y: auto; }
        .modal-body textarea { width: 100%; height: 100%; min-height: 250px; background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 4px; padding: 8px; resize: none; font-family: 'Courier New', monospace; font-size: 13px; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding-top: 10px; margin-top: 10px; border-top: 1px solid var(--border-color); }

        /* Desktop Layout */
        @media (min-width: 768px) {
            .main { flex-direction: row; }
            .edt { flex: 1; border-right: 1px solid var(--border-color); }
            .cfg { display: flex; flex-direction: column; width: 320px; flex-shrink: 0; }
            .bottom-nav { display: none; }
            .panel.active { display: flex; }
        }
    </style>
</head>
<body>
    <div class="top">
        <h1>Document Creator</h1>
        <div class="btns">
            <label for="md-upload" class="file-upload-label act">Upload MD</label>
            <input type="file" id="md-upload" accept=".md, .markdown, .txt">
            <button id="prv" class="act">Preview</button>
            <button id="exp" class="act">Export</button>
            <button id="code-btn" class="act">Code</button>
        </div>
    </div>

    <div class="main">
        <div id="editor-panel" class="panel edt active">
            <textarea id="md" placeholder="Paste your Markdown here or use 'Upload MD' to load a file..."></textarea>
        </div>
        <div id="settings-panel" class="panel cfg">
            <h3>Template & Colors</h3>
            <div class="pnl">
                <div class="cfg-row"><label class="cfg-lbl">Page Theme</label><select id="page-theme"><option value="auto">Automatic (Dark/Light)</option><option value="light">Light Only</option><option value="dark">Dark Only</option></select></div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px;">
                    <div><label class="cfg-lbl">Primary</label><input type="color" id="c1" value="#007AFF"></div>
                    <div><label class="cfg-lbl">Secondary</label><input type="color" id="c2" value="#FF9500"></div>
                </div>
            </div>

            <h3>Typography</h3>
            <div class="pnl">
                <div class="cfg-row"><label class="cfg-lbl">Font Family</label><select id="fnt"><option value="sans">Sans-serif</option><option value="serif">Serif</option><option value="mono">Monospace</option></select></div>
                <div class="cfg-row">
                    <label class="cfg-lbl">Base Size (px)</label>
                    <div class="slider-group"><input type="range" id="fsz-slider" min="12" max="20" value="16"><input type="number" id="fsz-input" min="12" max="20" value="16"></div>
                </div>
                 <div class="cfg-row">
                    <label class="cfg-lbl">Line Height</label>
                    <div class="slider-group"><input type="range" id="lnh-slider" min="1.2" max="2.0" step="0.1" value="1.7"><input type="number" id="lnh-input" min="1.2" max="2.0" step="0.1" value="1.7"></div>
                </div>
            </div>

            <h3>Layout</h3>
             <div class="pnl">
                <div class="cfg-row">
                    <label class="cfg-lbl">Max Width (px)</label>
                    <div class="slider-group"><input type="range" id="mxw-slider" min="600" max="1200" step="10" value="800"><input type="number" id="mxw-input" min="600" max="1200" step="10" value="800"></div>
                </div>
                <div class="cfg-row">
                    <label class="cfg-lbl">Border Radius (px)</label>
                    <div class="slider-group"><input type="range" id="brd-slider" min="0" max="24" value="8"><input type="number" id="brd-input" min="0" max="24" value="8"></div>
                </div>
            </div>

            <h3>Header & Footer</h3>
            <div class="pnl">
                <label class="cfg-lbl"><input type="checkbox" id="shw-hdr" checked> Show Header</label>
                <input type="text" id="hdr-ttl" placeholder="Header Title" value="My Document" style="margin-top: 4px;">
                <input type="text" id="hdr-sub" placeholder="Header Subtitle" style="margin-top: 4px;">
                <hr style="margin: 12px 0; border: none; border-top: 1px solid var(--border-color);">
                <label class="cfg-lbl"><input type="checkbox" id="shw-ftr" checked> Show Footer</label>
                <input type="text" id="ftr-txt" placeholder="Footer content" value="© 2026 All rights reserved" style="margin-top: 4px;">
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <button id="nav-editor" class="nav-btn active">Editor</button>
        <button id="nav-settings" class="nav-btn">Settings</button>
    </div>

    <div id="html-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header"><h2>View & Edit HTML</h2><span class="close-button">&times;</span></div>
            <div class="modal-body"><textarea id="html-code"></textarea></div>
            <div class="modal-footer">
                <button id="copy-html-btn" class="act">Copy</button>
                <button id="preview-html-btn" class="act">Preview Edits</button>
            </div>
        </div>
    </div>

    <script>
        // --- Element Caching ---
        const D = document;
        const get = (id) => D.getElementById(id);
        const elements = {
            md: get('md'), mdUpload: get('md-upload'),
            pageTheme: get('page-theme'), c1: get('c1'), c2: get('c2'),
            fnt: get('fnt'), 
            fszSlider: get('fsz-slider'), fszInput: get('fsz-input'),
            lnhSlider: get('lnh-slider'), lnhInput: get('lnh-input'),
            mxwSlider: get('mxw-slider'), mxwInput: get('mxw-input'),
            brdSlider: get('brd-slider'), brdInput: get('brd-input'),
            shwHdr: get('shw-hdr'), hdrTtl: get('hdr-ttl'), hdrSub: get('hdr-sub'), shwFtr: get('shw-ftr'), ftrTxt: get('ftr-txt'),
            htmlModal: get('html-modal'), htmlCode: get('html-code'), closeModalBtn: D.querySelector('.close-button'),
            codeBtn: get('code-btn'), copyHtmlBtn: get('copy-html-btn'), previewHtmlBtn: get('preview-html-btn'),
            prvBtn: get('prv'), expBtn: get('exp'),
            navEditor: get('nav-editor'), navSettings: get('nav-settings'),
            editorPanel: get('editor-panel'), settingsPanel: get('settings-panel'),
        };

        // --- Theme Switcher ---
        const getThemeSwitcherScript = () => `const t=document.getElementById("theme-toggle");if(t){const e=document.documentElement,a=localStorage.getItem("pageTheme");a&&e.setAttribute("data-theme",a),t.addEventListener("click",()=>{const a="dark"===e.getAttribute("data-theme")?"light":"dark";e.setAttribute("data-theme",a),localStorage.setItem("pageTheme",a)})}`;
        const getThemeToggleHtml = () => `<button id="theme-toggle" aria-label="Toggle theme" style="position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--bg-secondary);color:var(--text-primary);cursor:pointer;z-index:999;display:flex;align-items:center;justify-content:center;"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sun"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="moon"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></button>`;

        // --- Core Generation Functions ---
        const getFont = (val) => ({ sans: '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif', serif: 'Georgia,serif', mono: '"Courier New",monospace' })[val || elements.fnt.value];

        const genCss = () => {
            const themeMode = elements.pageTheme.value;
            let themeCss = `:root { --accent: ${elements.c1.value}; --accent-secondary: ${elements.c2.value}; --font-family: ${getFont()}; --border-radius: ${elements.brdInput.value}px; --max-width: ${elements.mxwInput.value}px; }`;

            if (themeMode === 'light') {
                themeCss += `:root { --bg-primary: #FFFFFF; --bg-secondary: #F9F9F9; --text-primary: #111111; --text-secondary: #555555; --border: #EAEAEA; }`;
            } else if (themeMode === 'dark') {
                themeCss += `:root { --bg-primary: #121212; --bg-secondary: #1E1E1E; --text-primary: #E0E0E0; --text-secondary: #AAAAAA; --border: #333333; }`;
            } else { // 'auto'
                themeCss += `
                    :root { --bg-primary: #FFFFFF; --bg-secondary: #F9F9F9; --text-primary: #111111; --text-secondary: #555555; --border: #EAEAEA; }
                    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg-primary: #121212; --bg-secondary: #1E1E1E; --text-primary: #E0E0E0; --text-secondary: #AAAAAA; --border: #333333; } }
                    [data-theme="dark"] { --bg-primary: #121212; --bg-secondary: #1E1E1E; --text-primary: #E0E0E0; --text-secondary: #AAAAAA; --border: #333333; }
                    [data-theme="light"] { --bg-primary: #FFFFFF; --bg-secondary: #F9F9F9; --text-primary: #111111; --text-secondary: #555555; --border: #EAEAEA; }
                    #theme-toggle .sun { display: block; } #theme-toggle .moon { display: none; }
                    [data-theme="dark"] #theme-toggle .sun { display: none; } [data-theme="dark"] #theme-toggle .moon { display: block; }
                `;
            }

            return `${themeCss}* { margin: 0; padding: 0; box-sizing: border-box; } html { scroll-behavior: smooth; } body { font-family: var(--font-family); background: var(--bg-primary); color: var(--text-primary); line-height: ${elements.lnhInput.value}; font-size: ${elements.fszInput.value}px; transition: background 0.2s, color 0.2s; } .doc-wrapper { display: flex; justify-content: center; padding: 40px 16px; } .doc { width: 100%; max-width: var(--max-width); } h1, h2, h3, h4, h5, h6 { color: var(--accent); margin: 1.5em 0 0.8em; font-weight: 700; line-height: 1.3; } p { margin: 1em 0; } a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; } code { background: var(--bg-secondary); padding: 2px 6px; border-radius: var(--border-radius); font-family: ${getFont('mono')}; font-size: 90%; } pre { background: var(--bg-secondary); padding: 1em; border-radius: var(--border-radius); overflow-x: auto; margin: 1.5em 0; border: 1px solid var(--border); } blockquote { border-left: 4px solid var(--accent); padding-left: 1.5em; margin: 1.5em 0; color: var(--text-secondary); font-style: italic; } table { border-collapse: collapse; margin: 1.5em 0; width: 100%; } table th, table td { border: 1px solid var(--border); padding: 10px; text-align: left; } table th { background: var(--bg-secondary); font-weight: 600; } .hdr { background: linear-gradient(135deg, var(--accent), var(--accent-secondary)); color: white; padding: 40px; text-align: center; border-radius: var(--border-radius); margin-bottom: 3em; } .hdr h1 { color: white; margin: 0 0 8px; } .hdr p { color: rgba(255,255,255,0.9); margin: 0; } .ftr { border-top: 1px solid var(--border); padding: 2em 0; margin-top: 3em; text-align: center; color: var(--text-secondary); font-size: 90%; } img { max-width: 100%; height: auto; border-radius: var(--border-radius); }`;
        };

        const genHtml = () => {
            const html = marked.parse(elements.md.value);
            const css = genCss();
            const themeMode = elements.pageTheme.value;
            let hdr = elements.shwHdr.checked ? `<div class="hdr"><h1>${elements.hdrTtl.value}</h1>${elements.hdrSub.value ? `<p>${elements.hdrSub.value}</p>` : ''}</div>` : '';
            let ftr = elements.shwFtr.checked ? `<div class="ftr">${elements.ftrTxt.value}</div>` : '';
            let bodyContent = `<div class="doc-wrapper"><div class="doc">${hdr}${html}${ftr}</div></div>`;
            if (themeMode === 'auto') {
                bodyContent += getThemeToggleHtml();
                script = `<script>${getThemeSwitcherScript()}<\/script>`;
            } else { script = ''; }
            return `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>${elements.hdrTtl.value}</title><style>${css}</style></head><body>${bodyContent}${script}</body></html>`;
        };

        // --- Event Handlers & Listeners ---
        const openPreview = (htmlContent) => { const blob = new Blob([htmlContent], { type: 'text/html' }); const url = URL.createObjectURL(blob); window.open(url, '_blank'); };
        const exportFile = () => { const blob = new Blob([genHtml()], { type: 'text/html' }); const a = D.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${elements.hdrTtl.value.replace(/\s+/g, '_').toLowerCase()}.html`; a.click(); URL.revokeObjectURL(a.href); };
        const openModal = () => { elements.htmlCode.value = genHtml(); elements.htmlModal.style.display = 'flex'; };
        const closeModal = () => { elements.htmlModal.style.display = 'none'; };
        const copyHtml = () => { navigator.clipboard.writeText(elements.htmlCode.value).then(() => { elements.copyHtmlBtn.textContent = 'Copied!'; setTimeout(() => { elements.copyHtmlBtn.textContent = 'Copy'; }, 2000); }); };
        const switchPanel = (panelToShow) => { const isEditor = panelToShow === 'editor'; elements.editorPanel.classList.toggle('active', isEditor); elements.settingsPanel.classList.toggle('active', !isEditor); elements.navEditor.classList.toggle('active', isEditor); elements.navSettings.classList.toggle('active', !isEditor); };
        const handleFileUpload = (event) => { const file = event.target.files[0]; if (file) { const reader = new FileReader(); reader.onload = (e) => { elements.md.value = e.target.result; }; reader.readAsText(file); } };

        // Function to sync slider and number input
        const syncInputs = (slider, input, isFloat = false) => {
            slider.addEventListener('input', () => input.value = slider.value);
            input.addEventListener('input', () => {
                let value = isFloat ? parseFloat(input.value) : parseInt(input.value);
                const min = parseFloat(input.min);
                const max = parseFloat(input.max);
                if (isNaN(value)) return;
                if (value < min) value = min;
                if (value > max) value = max;
                slider.value = value;
                input.value = value; // Correct the value if it was out of bounds
            });
        };

        syncInputs(elements.fszSlider, elements.fszInput);
        syncInputs(elements.lnhSlider, elements.lnhInput, true);
        syncInputs(elements.mxwSlider, elements.mxwInput);
        syncInputs(elements.brdSlider, elements.brdInput);

        elements.prvBtn.addEventListener('click', () => openPreview(genHtml()));
        elements.expBtn.addEventListener('click', exportFile);
        elements.codeBtn.addEventListener('click', openModal);
        elements.closeModalBtn.addEventListener('click', closeModal);
        elements.copyHtmlBtn.addEventListener('click', copyHtml);
        elements.previewHtmlBtn.addEventListener('click', () => openPreview(elements.htmlCode.value));
        window.addEventListener('click', (event) => { if (event.target == elements.htmlModal) closeModal(); });
        elements.navEditor.addEventListener('click', () => switchPanel('editor'));
        elements.navSettings.addEventListener('click', () => switchPanel('settings'));
        elements.mdUpload.addEventListener('change', handleFileUpload);
    </script>
</body>
</html>
